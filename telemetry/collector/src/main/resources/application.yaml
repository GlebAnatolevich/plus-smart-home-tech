spring:
  application:
    name: collector
  config:
    import: "configserver:"
  cloud:
    config:
      fail-fast: true
      retry:
        initial-interval: 300
        max-attempts: 3
        max-interval: 800
        multiplier: 1.2
      discovery:
        enabled: true
        serviceId: config-server
eureka:
  instance:
    preferIpAddress: false
  client:
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
